<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>div{
    background-color: red;
    width: 200px;
    height: 200px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    padding: 8px;
    }</style>
</head>
<body>
    <h1></h1>
    <div>
        hello i am going to hide in 5 seconds
    </div>
    <script>
    let counter = 5;
    let h1 = document.querySelector("h1");
    let div = document.querySelector("div");

    let timer = setInterval(() => {
        h1.textContent = `Div is going to hide in ${counter} seconds`;

        counter--;

        if (counter < 0) {
            clearInterval(timer); // stop interval
            div.style.display = "none";
            h1.textContent = "Div is now hidden!";
        }
    }, 1000);
</script>
    
</body>
</html>
