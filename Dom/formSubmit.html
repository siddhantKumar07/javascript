<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        padding: 3vw;
      }
      #main {
        display: block;
        padding: 20px 20px;
      }
      input {
        display: block;
        margin: 20px 20px;
        height: 5vh;
        width: 25vh;
      }
      #img{
        background-color: #ea6666;
        height: 100px;
        width: 100px;
        border-radius: 50%;
        overflow: hidden;

      }
      img{
        height: 50px;
        width: 50px;

      }
    </style>
  </head>
  <body>
    <div id="main">
      <form action="">
        <input type="text" placeholder="name" />
        <input type="text" placeholder="mail" />
        <input type="text" placeholder="age" />
        <input type="text" placeholder="src of img">
        <input type="submit" value="Submit" />
      </form>
      <script>
        let inputs = document.querySelectorAll("input");
        let name = inputs[0].value;
        let mail = inputs[1].value;
        let age = inputs[2].value;
        let img=inputs[3].value;

        let form = document.querySelector("form");
        let card = document.createElement("div");
        let names = document.createElement("h2");
        let ages = document.createElement("h2");
        let mails = document.createElement("h2");
        let imgs=document.createElement("img");
       imgs.setAttribute("src",img)

        form.addEventListener("submit", (e) => {
          e.preventDefault();
           document.body.append(card);
         card.append(imgs,names, ages, mails);
        }); 
        card.style.borderRadius="20px"
        card.style.border="2px solid black"
        card.style.height = "45vh";
        card.style.width = "40vh";
        card.style.backgroundColor = "grey";
        card.style.padding = "20px 10px ";

         names.innerText = `Name : ${name}`;
          mails.textContent = `Mail : ${mail}`;
          ages.textContent = `age : ${age}`;
        
      </script>
    </div>
  </body>
</html>
