<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,html{
            height: 100%;
            width: 100%;
        }
        main{
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
  </head>
  
  <body>
    <!-- when user type on screeen it shows printed on screeen -->
    <main>
      <h1></h1>
    </main>
    <script>
  let text = "";
  let h = document.querySelector("h1");
  let main = document.querySelector("main");

  let p = document.createElement("p");
  main.append(p);

  document.addEventListener("keypress", (e) => {
    h.textContent = e.key;
    text += e.key;
    p.textContent = text;
  });
</script>
  </body>
</html>
