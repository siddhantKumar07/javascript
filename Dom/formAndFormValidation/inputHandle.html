<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #main {
      }
      input,select,textarea {
        margin: 10px 25px;
      }
      #hide{
        display: none;
        color: red;
        font-size: 30px;
      }
    </style>
  </head>
  <body>

      <form action="">
        <input id="name" minlength="5" required type="text" placeholder="Name" /> 
        <br> 
        <div id="hide">
          <small> your name should be greater than 2 characteer</small>
        </div><br>
        <input type="text" placeholder="email" /><br><br>
        <input type="text" placeholder="password" /><br><br>
        <select>
          <option value="Male">male</option>
          <option value="Female">female</option>
          <option value="other">Other</option>
        </select><br><br>
        <textarea placeholder="tell me about you"></textarea><br><br>
       <input type="submit">
      </form>
<script>
  let nm = document.querySelector("#name")
  let form = document.querySelector("form")
  let hideDiv= document.querySelector("#hide");
  form.addEventListener('submit', (e)=>{
    e.preventDefault()
    if(nm.value.length<=2){
      hideDiv.style.display="initial"
  }
  else{
    hideDiv.style.display="none" 
  }
  })
  
  
</script>
  </body>
</html>
