<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100%;
            width: 100%;
            position: relative;
        }
        div{
            height: 20px;
            width: 20px;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s ;
            background-color: rgb(139, 5, 27);
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>
<body>
    <!-- create a circle which moves according to the mouse -->
    <div></div>
    <script>
        let div =document.querySelector("div")
        document.addEventListener('mousemove', (e)=>{
           div.style.left=e.clientX+"px"
           div.style.top=e.clientY+"px"
        })
    </script>
</body>
</html>
