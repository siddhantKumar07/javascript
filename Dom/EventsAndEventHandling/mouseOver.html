<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 150px;
            width: 150px;
            background-color: yellow;
        }
        .new{
            background-color: red;
        }
    </style>
</head>
<body>
    <div></div>
    <script>
        let div =document.querySelector("div")
        div.addEventListener('mousedown', ()=>{//mousedown means when you click on where the listner have 
            div.classList.toggle("new")
        })
    </script>
    
</body>
</html>
