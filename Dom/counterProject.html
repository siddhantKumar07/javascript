<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
      main {
        height: 100vh;
        width: 100vw;
        background-color: rgb(13, 129, 129);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #counter {
        height: 15vh;
        width: 30vw;
        display: flex;
        align-items: stretch;
        background-color: grey;
      }
      #increase {
        font-size: 25px;
        height: 100%;
        width: 33%;
        background-color: yellow;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #count {
        height: 100%;
        width: 34%;
        background-color: rgb(115, 193, 225);
        display: flex;
        align-items: center;
        justify-content: center;
          font-size: 1.8vw;
          font-weight: 900;
      }
      #decrease {
        font-size: 25px;
        height: 100%;
        width: 33%;
        background-color: red;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #increase button{
        height: 100%;
        width: 100%;
          font-size: 1.8vw;
        background-color: rgb(148, 248, 148);
      }
      #decrease button{
        height: 100%;
        width: 100%;
        font-size: 1.8vw;
        background-color: rgb(193, 23, 0);
      }
    </style>
  </head>
  <body>
    <main>
        <h1>click to increase and decrease</h1>
      <div id="counter">
        <span id="increase"><button>Increase</button></span>
        <span id="count">0</span>
        <span id="decrease"><button>Decrease</button></span>
      </div>
    </main>

    <script>
      let count = 0;
      let increase = document.querySelector("#increase");
      let decrease = document.querySelector("#decrease");
      let counts = document.querySelector("#count");
      
      increase.addEventListener('click', ()=>{
             count++;
            counts.textContent=count;
      })
      decrease.addEventListener('click', ()=>{
             count--;
            counts.textContent=count;
      })
    
    </script>
  </body>
</html>
