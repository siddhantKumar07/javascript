<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #downloadingBar {
            width: 100%;
            height: 30px;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            width: 0;
            background-color: #4caf50;
            text-align: center;
            line-height: 30px;
            color: white;
        }
        main{
            width: 50%;
            margin: 0 auto;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Downloading...</h1>
        <div id="downloadingBar">
            <div id="progress"></div>
        </div>
    </main>
    <script >
        const progressBar = document.getElementById('progress');
        let progress = 0;

        const interval = setInterval(() => {
            if (progress >= 100) {
                clearInterval(interval);
                progressBar.textContent = 'Download Complete';
            } else {
                progress += 5; // Increment progress by 10%
                progressBar.style.width = progress + '%';
                progressBar.textContent = progress + '%';
            }
        }, 1000); // Update every second

        
    </script>
</body>
</html>
