<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    main{
        height: 50vw;
        margin: 0 auto;
        background-color: yellow;
        padding: 1px;
    }
    #section{
        width: 25vw;
        height: 45vh;
        margin: 10vh auto;
        /* padding-top: 100px; */
        background-color: grey;
        border-radius: 20px;

    }
    h1{
        text-align: center;
        margin-top: 20vh;
    }
    #progress{
        /* height: 40px; */
        width: 22vw;
        background-color: rgb(68, 4, 4);
        text-align: center;
        /* margin: 10vh auto; */
        margin-top: 15vh;
         border-radius: 12px;
        text-align: center;
            line-height: 40px;
    }
    #inner{
        width: 0;
        height: 100%;
        font-size: 20px;
         border-radius: inherit;
        font-weight: bold;
        text-align: center;

    }
</style>
</head>
<body>
    <main>
        <div id="section">
            <h1>Downloading...</h1>
        <div id="progress">
            <div id="inner"></div>
        </div>
        </div>
    </main>
    
    <script>
let inner = document.querySelector("#inner");
let progress=0;
let interval = setInterval(()=>{
if(progress==100){
    clearInterval(interval);
    inner.textContent="completed"
}
else{
    progress+=10;
    inner.style.backgroundColor="red"
    inner.style.width= progress+"%"
    inner.textContent=progress+"%"
}
},1000)
    </script>
</body>
</html>
