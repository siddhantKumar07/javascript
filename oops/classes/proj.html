    <script>
   class user {
    constructor(name) {
        this.name = name;
       
    }
    write(text){
        let h1 = document.createElement("h1");
        h1.textContent =`${this.name} : ${text}`;
        document.body.appendChild(h1);
    }
   }
   class admin extends user{
    constructor(name,role){
        this.role = role;
        super(name);
    }
    delete(user){
        h1.querySelectorAll("h1").forEach((h1)=>{
            if(h1.textContent.includes(user.name)){
                h1.remove();
            }
        });
    }
   }
   let user1 = new user("Alice");
   let user2 = new user("Bob");
    let admin1 = new admin("Charlie","admin");
        
    </script>
