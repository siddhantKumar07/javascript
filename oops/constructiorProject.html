<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pencil</title>
</head>
<body>
    


    <script>
        class Pencil {
            constructor(name,color, length) {
                this.color = color;
                this.length = length;
                this.name = name;
            }

            write() {
              let h1=  document.createElement("h1").innerText = `The ${this.color} pencil is writing.`;
                document.body.append(h1);

            }
        }
        const myPencil = new Pencil("HB", "yellow", 7);
        console.log(myPencil); // Pencil { name: 'HB', color: 'yellow', length: 7 }
        myPencil.write(); // The yellow pencil is writing.
    </script>
</body>
</html>
