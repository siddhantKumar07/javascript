    <script>
        class Pencil {
            constructor(name,color, length) {
                this.color = color;
                this.length = length;
                this.name = name;
            }

            write(text) {
              let h1=  document.createElement("h1")
              h1.innerText = `The ${this.name} pencil is writing and the color is ${this.color}.`;
              h1.style.color = this.color;
              h1.style.fontSize = `${this.length}px`;
              h1.style.textAlign = "center";
                document.body.append(h1);

            }
        }
