<!DOCTYPE html>
<html>
<head>
    <title>Including JS Files</title>
</head>
<body>

<h2>JavaScript Inclusion Demo</h2>

<script>
    // INTERNAL JAVASCRIPT
    function internalFunction() {
        document.write("<b>Internal JS Executed</b><br>");
    }

    internalFunction();
</script>

<!-- EXTERNAL JAVASCRIPT -->
<script src="external.js"></script>

<!-- MODULE (JS inside JS) -->
<script type="module" src="main.js"></script>

</body>
</html>
