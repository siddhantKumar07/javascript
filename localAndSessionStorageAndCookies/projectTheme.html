<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Toggle</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
      background-color: rgb(171, 25, 49);
    }

    /* Light Theme */
    body.light {
      background: #dcdada;
      color: #000000;
    }

    /* Dark Theme */
    body.dark {
      background: #121212;
      color: #ffffff;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    body.light button {
      background: #000;
      color: #fff;
    }

    body.dark button {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body class="light">
  <button id="toggleBtn">Toggle Theme</button>

  <script>
    const button = document.getElementById("toggleBtn");
    const body = document.body;

    button.addEventListener("click", () => {
        body.classList.toggle("dark");
    });
  </script>
</body>
</html>
