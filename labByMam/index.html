<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-image: linear-gradient(to right, rgb(206, 157, 157),rgb(74, 115, 202),pink);
        
      }
      #container {
        width: 400px;
        height: 400px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        top: 200px;
        box-shadow: 0 0 10px 2px rgb(189, 172, 172);
        border-radius: 20px;
      }
      form {
        width: 100%;
        height: 80%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #a6d8f0;
        border-radius: 20px;
      }
      #name {
        height: 4vh;
        border-radius: 10px;
        font-size: larger;
      }
      #email {
        height: 4vh;
        border-radius: 10px;
        font-size: larger;
      }
      #pass {
        height: 4vh;
        border-radius: 10px;
        font-size: larger;
      }
      #submit {
        margin-top: 7px;
        background-color: #1b63bc;
        padding: 10px;
        border-radius: 7px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" /><br /><br />
        <label for="pass">Password</label>
        <input type="password" id="pass" />
        <input type="submit" value="Submit" id="submit" />
      </form>
    </div>
    <script>
      let email = document.querySelector("#email");
      let name = document.querySelector("#name");
      let pass = document.querySelector("#pass");
      let submit = document.querySelector("#submit");
      let form = document.querySelector("form")
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$/;

      submit.addEventListener("click", (e) => {
        e.preventDefault();
        if(name.value.length<=5)
      {
        alert("name should be greater than 5")
        return;
      }
      else{
        console.log(`name => ${name.value}`);
      }
      if(emailRegex.test(email.value)){
        console.log(`email => ${email.value}`);
      }else{
        alert("wrong formate")
        return;
      }
      if(!passRegex.test(pass.value)){
 alert("Password must contain uppercase, lowercase, number & special character");
 return;
      }else{
        console.log(`password => ${pass.value}`);
      }
      console.log("form submitted successfully");
form.reset();
      });
    </script>
  </body>
</html>
