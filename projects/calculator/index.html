<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #1f1c2c, #928dab);
}

/* Calculator */
.calculator {
  backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.08);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  width: 420px;
}

/* Display */
.display {
  margin-bottom: 20px;
}

#display {
  width: 100%;
  height: 70px;
  border: none;
  outline: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 28px;
  text-align: right;
  background: rgba(255,255,255,0.1);
  color: white;
}


.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.btn {
  height: 60px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  color: white;
  transition: 0.2s;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

.operator {
  background: #ff9500;
}

.operator:hover {
  background: #ffa733;
}

.equal {
  background: #00c853;
}

.equal:hover {
  background: #00e676;
}

.gray {
  background: #9e9e9e;
  color: black;
}

.gray:hover {
  background: #bdbdbd;
}

.zero {
  grid-column: span 2;
}
</style>

</head>
<body>

<div class="calculator">
  <div class="display">
    <input type="text" id="display" placeholder="00" />
  </div>

  <div class="buttons">
    <button class="btn gray" onclick="clearDisplay()">C</button>
    <button class="btn gray" onclick="deleteLast()">DEL</button>
    <button class="btn operator" onclick="appendValue('%')">%</button>
    <button class="btn operator" onclick="appendValue('/')">÷</button>

    <button class="btn" onclick="appendValue('7')">7</button>
    <button class="btn" onclick="appendValue('8')">8</button>
    <button class="btn" onclick="appendValue('9')">9</button>
    <button class="btn operator" onclick="appendValue('*')">×</button>

    <button class="btn" onclick="appendValue('4')">4</button>
    <button class="btn" onclick="appendValue('5')">5</button>
    <button class="btn" onclick="appendValue('6')">6</button>
    <button class="btn operator" onclick="appendValue('-')">−</button>

    <button class="btn" onclick="appendValue('1')">1</button>
    <button class="btn" onclick="appendValue('2')">2</button>
    <button class="btn" onclick="appendValue('3')">3</button>
    <button class="btn operator" onclick="appendValue('+')">+</button>

    <button class="btn zero" onclick="appendValue('0')">0</button>
    <button class="btn" onclick="appendValue('.')">.</button>
    <button class="btn equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
    let display = document.querySelector("#display");
      display.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            calculate();

        }
      });

function appendValue(value) {
  display.value += value;
}

function clearDisplay() {
  display.value = "";
}

function deleteLast() {
  display.value = display.value.slice(0, display.value.length - 1);
}


function calculate() {
  try {
    // display.value = eval(display.value); //eval is not recommended due to security risks and potential bugs, especially with user input. It can execute arbitrary code if the input is not properly sanitized.
    display.value = math.evaluate(display.value);//this is the safer way to evaluate the expression, it handles more complex expressions and is less prone to security issues than eval.
  } catch {
    display.value = "Error";
    if (display.value === "Error") {
      setTimeout(() => {
        display.value = "";
      }, 1000);
    }
  }
}
</script>
</body>
</html>
