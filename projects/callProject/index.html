<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Call Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="card-container">

    <!-- left buttons -->
    <div class="side-buttons">
        <button id="add">+</button>
        <button>↑</button>
        <button>↓</button>
    </div>

    <!-- main card -->
    <div class="card">

     <div class="profile">
        <img id="card-img" src="https://i.pravatar.cc/100" alt="">
        <div>
            <h3 id="card-name">Fatima Uma</h3>
            <p id="card-town">Home town</p>
        </div>
    </div>

    <div class="info">
        <div>
            <p id="card-purpose">Singapore</p>
            <span id="card-category">Bookings</span>
        </div>
        <div>
            <p id="card-count">1 time</p>
        </div>
    </div>

        <div class="actions">
            <button class="call">📞 Call</button>
            <button class="msg">Message</button>
        </div>

    </div>

    <!-- color buttons -->
    <div class="colors">
        <button class="dot black"></button>
        <button class="dot purple"></button>
        <button class="dot brown"></button>
        <button class="dot teal"></button>
    </div>

</div>

<div class="form-container">
    <h2>New Call</h2>

    <label>Image URL</label>
    <input required type="text" id="img-url" placeholder="https://example.com/photo.jpg">

    <label>Full Name</label>
    <input required type="text" id="full-name"  placeholder="Enter full name">

    <label>Home Town</label>
    <input required type="text" id="home-town" placeholder="Enter home town">

    <label>Purpose</label>
    <input required type="text" id="purpose" placeholder="e.g., Quick appointment note">

    <label>Category</label>
    <div class="tags">
        <label class="tag emergency">
            <input required type="radio" name="category" value="Emergency">
            <span>Emergency</span>
        </label>

        <label class="tag important">
            <input required type="radio" name="category" value="Important">
            <span>Important</span>
        </label>

        <label class="tag urgent">
            <input required type="radio" name="category" value="Urgent">
            <span>Urgent</span>
        </label>

        <label class="tag">
            <input required type="radio" name="category" value="No Rush">
            <span>No Rush</span>
        </label>
    </div>

    <button class="btn create">Create Note</button>
    <button class="btn close">Close</button>
</div>
<script src="script.js"></script>

</body>
</html>
