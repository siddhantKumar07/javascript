<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hello{
            width: 400px;
            height: 40px;
            background-color: #f0f0f0;
            border: 2px solid #312424;
            position: absolute;
            /* left: 20px; */
            right: 0px;
        }
    </style>
</head>
<body>
    
    <script>
        function createtoaster(obj){// this function will create a toaster function that will show the notification for a certain duration
            return function(notifi){
     let div = document.createElement("div");
     div.classList.add("hello");
     div.textContent=notifi;
     document.body.append(div)
     setTimeout(()=>{// this will remove the notification after the specified duration
document.body.removeChild(div);
     },obj.duration*1000)
            }
        }
   let toaster=createtoaster({duration:3});// this will create a toaster function that will show the notification for 3 seconds
   toaster("Hello World");// this will show the notification "Hello World" for 3 seconds
    </script>
    
</body>
</html>
