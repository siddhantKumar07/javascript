<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="btn">Click me</button>

    

    <script>
        function createToaster() {
            let count = 0;
            return function() {
                count++;// Increment the count each time the button is clicked
                alert(`You have clicked the button ${count} times!`);
            }
        }

        const toaster = createToaster();
        document.getElementById('btn').addEventListener('click', toaster);
    </script>
</body>
</html>
