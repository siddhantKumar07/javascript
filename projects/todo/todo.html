    <title>Document</title>
    <style>
        #container{
            width: 400px;
            height: auto;
            margin: 20vh auto;
            text-align: center;
            border:1px solid #000000;
            box-shadow: inset 0px 0 8px #000000;
            padding: 20px;
        }
        #inputContainer{
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #todoInput{
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        #addBtn{

            margin-left: 10px;
