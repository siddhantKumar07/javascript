<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        #inputContainer{
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #todoInput{
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        #addBtn{
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
     <h1>Simple Todo List</h1>
     <div id="inputContainer">
        <input type="text" placeholder="add some task here...."id="todoInput">
        <button id="addBtn">Add</button>
     </div>
    </div>
</body>
</html>
