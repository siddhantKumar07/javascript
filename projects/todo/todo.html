<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 400px;
            height: auto;
            margin: 20vh auto;
            text-align: center;
            border:1px solid #000000;
            box-shadow: inset 0px 0 8px #000000;
            padding: 20px;
        }
        #inputContainer{
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #todoInput{
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        #addBtn{
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            background-color: #3ac5c3;
        }
    </style>
</head>
<body>
    <div id="container">
     <h1>Simple Todo List</h1>
     <div id="inputContainer">
        <input type="text" placeholder="add some task here...."id="todoInput">
        <button id="addBtn">Add</button>
     </div>
    </div>

    <script>
        const addBtn = document.getElementById('addBtn');
        const todoInput = document.getElementById('todoInput');
        const container = document.getElementById('container');
     document.body.addEventListener('keypress',(e)=>{
        if(e.code =="enter"){
             addBtn.addEventListener('click', () => {
            const task = todoInput.value.trim();
            if(task){
                const taskElement = document.createElement('div');
                taskElement.textContent = task;
                taskElement.style.marginTop = '10px';
                taskElement.style.padding = '10px';
                taskElement.style.border = '1px solid #000000';
                taskElement.style.backgroundColor = "lightblue";
                container.appendChild(taskElement);
                todoInput.value = '';
            }
        });
        }
     })
       
    </script>
</body>
</html>
