<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Cards</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      padding: 20px;
    }

    /* Search Bar */
    .search-container {
      max-width: 500px;
      margin: 0 auto 30px;
    }

    .search-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .search-input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    /* Card Grid */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    /* Image */
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    /* Content */
    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin-bottom: 8px;
      color: #333;
    }

    .card-content p {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Empty State */
    .no-results {
      text-align: center;
      margin-top: 40px;
      color: #888;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Search -->
  <div class="search-container">
    <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Search cards..." 
    />
  </div>

  <!-- Cards -->
  <div class="card-container" id="cardContainer">

    <!-- Card 1 -->
    <div class="card" data-name="john">

      <div class="card-content">

    <!-- Card 3 -->

    <!-- Card 4 -->

        <h3>Emma Watson</h3>

    </div>

        jdsh

  </div>

  <!-- No Results -->

    No matching cards found
