<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
   <main  >
    <div id="wrapper">

        <h1>Password Generator</h1>
      <section id="displaypass">
         <input readonly class="display" placeholder="Password" dataPasswordDisplay>
            <button dataCopy class="copy">
                <span dataCopyMessage ></span>
                <img src="./assets/copy.svg" alt="pic">
            </button>

      </section>
           <article class="down">
           
            <section>
                <div id="lengthContainer">
                <p>Password Length</p>
                <p data-lengthnumber>0</p>
            </div>
            </section>
            <!-- slider  -->
            <div id="range">           
                 <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>
            </div>
            <!-- checckbox -->
            <div>
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Include uppercase Letter</label>
            </div>
            <div>
                <input type="checkbox" id="lowercase">
                <label for="lowercase">Include lowercase Letter</label>
            </div>
            <div>
                <input type="checkbox" id="number">
                <label for="number">Include numbers</label>
            </div>
            <div>
                <input type="checkbox" id="symbol">
                <label for="symbol">Include symbols</label>
            </div>


            <!-- for strgth div   -->
                <div class="stregth">
                    <p>Strength</p>
                    <div id="strengthIndicator"></div>
                </div>
            
            <!-- for the button  -->

            <button id ="passGen">Generate Password</button>
</article>
    </div>
</main>
   
    <script src="script.js"></script>
</body>
</html>
