<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <span id="kanbantxt">Kanban Board</span>
        <span id="addtask">
          <button>Add new task</button>
        </span>
      </nav>

      <section>
        <div id="todo">
          <div class="top">
            <span> TO DO</span>
            <span id="count">count</span>
          </div>
          <div class="container">
            
          </div>
        </div>
        <div id="progress">
          <div class="top">
            <span> IN PROGRESS</span>
            <span id="count">count</span>
          </div>
        </div>
        <div id="done">
            <div class="top">
          <span> DONE</span>
          <span id="count">count</span>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
