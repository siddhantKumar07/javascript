<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <span id="kanbantxt">Kanban Board</span>
        <span id="addtask">
          <button id="addNewTaskbtn">Add new task</button>
        </span>
      </nav>

      <section>
        <div id="todo">
          <div class="top">
            <span> TO DO</span>
            <span id="todoCount">count</span>
          </div>
          <div class="container">
          
          </div>
        </div>
        <div id="progress">
          <div class="top">
            <span> IN PROGRESS</span>
            <span id="progressCount">count</span>
          </div>
        </div>
        <div id="done">
            <div class="top">
          <span> DONE</span>
          <span id="doneCount">count</span>
          </div>
        </div>
      </section>
    </main>

    <form >
      <label style="padding-left: 8px;" for="taskname">Task name :</label>
      <input type="text" id="taskname"><br><br>
      <label for="description">Description :</label>
      <input type="text" id="description"><br><br>
      <input id="submitbtn"type="submit" value="Submit">
    </form>

    <script src="script.js"></script>
  </body>
</html>
