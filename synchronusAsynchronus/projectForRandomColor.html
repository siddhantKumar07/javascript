<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: green;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main container */
.container {
    text-align: center;
    margin-top: -100px;
}

/* Title */
h1 {
    background: #eee;
    padding: 15px 30px;
    border-radius: 8px;
    display: inline-block;
    font-size: 40px;
    margin-bottom: 20px;
}

/* Controls layout */
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
}

/* Buttons */
button {
    background-color: #2aa6a6;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    color: black;
    transition: 0.3s;
}

button:hover {
    background-color: #238888;
}

/* Input */
input {
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 250px;
    font-size: 16px;
}

/* Current color display */
.current-color {
    background: #eee;
    padding: 12px 20px;
    border-radius: 8px;
    display: inline-block;
    font-size: 18px;
}
    </style>
</head>
<body>
     <div class="container">
        <h1>Color Changer</h1>

        <div class="controls">
            <button id="randomBtn">Random Color</button>

            <input type="text" id="colorInput" placeholder="Enter a color or hex (e.g. white or #ff0000)">

            <button id="applyBtn">Apply Color</button>
        </div>

        <div class="current-color">
            Current Color: <span id="colorName">green</span>
        </div>
    </div>
    
    <script>
        let random = document.getElementById('randomBtn');
        let apply = document.getElementById('applyBtn');

        // this is for to get a random color from the api;
async function getColor() {
    try {
        const response = await fetch('https://x-colors.yurace.pro/api/random');
        const data = await response.json();
        random.addEventListener('click', () => {
            // document.body.style.backgroundColor = data.hex.value;
            console.log(data.hex);
            document.getElementById('colorName').textContent = data.hex.value;
        });
    } catch (error) {
        console.error(error);
    }
}
getColor();
</script>
</body>
</html>
